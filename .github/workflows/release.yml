name: Release CPA Helper Plugin

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  GO_VERSION: '1.26.x'

jobs:
  validate:
    name: Validate Go sources
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

  build-linux:
    name: Build Linux amd64 archive
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build archive
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          test "$version" != "$RELEASE_VERSION"
          test -n "$version"
          mkdir -p release/linux
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -trimpath \
            -ldflags "-X cpa-helper-plugin/internal/policy.Version=$version" \
            -buildmode=c-shared \
            -o cpa-helper-plugin.so ./cmd/cpa-helper-plugin
          (cd release/linux && zip -q -j "cpa-helper-plugin_${version}_linux_amd64.zip" ../../cpa-helper-plugin.so)

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/linux/*.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows amd64 archive
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Set up UCRT64 compiler
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build archive
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_VERSION -replace '^v', ''
          if ($version -eq $env:RELEASE_VERSION -or [string]::IsNullOrWhiteSpace($version)) {
            throw "Release tag must start with v"
          }
          $env:CGO_ENABLED = '1'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CC = 'C:\msys64\ucrt64\bin\gcc.exe'
          New-Item -ItemType Directory -Force -Path release\windows | Out-Null
          go build -trimpath `
            -ldflags "-X cpa-helper-plugin/internal/policy.Version=$version" `
            -buildmode=c-shared `
            -o cpa-helper-plugin.dll ./cmd/cpa-helper-plugin
          Compress-Archive -Path cpa-helper-plugin.dll `
            -DestinationPath "release\windows\cpa-helper-plugin_${version}_windows_amd64.zip"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/windows/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum *.zip > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.zip
            release/checksums.txt
